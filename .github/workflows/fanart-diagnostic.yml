
name: Diagnose Fan Art Discovery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest

    steps:
      - name: Test anonymous Openverse search
        run: |
          python - <<'PY'
          import json
          import urllib.error
          import urllib.parse
          import urllib.request

          queries = [
              "Resident Evil Code Veronica",
              "Claire Redfield",
              "Resident Evil fan art",
          ]

          for query in queries:
              print(f"\nSearching: {query}", flush=True)

              params = urllib.parse.urlencode({
                  "q": query,
                  "page_size": 10,
              })

              url = (
                  "https://api.openverse.org/v1/images/?"
                  + params
              )

              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "DidacticJamArtBot/1.0",
                      "Accept": "application/json",
                  },
              )

              try:
                  with urllib.request.urlopen(
                      req, timeout=15
                  ) as response:
                      data = json.load(response)

                  print(
                      "Total matches:",
                      data.get("result_count", 0),
                  )

                  for image in data.get("results", [])[:5]:
                      print(
                          "Title:",
                          image.get("title"),
                          "| License:",
                          image.get("license"),
                      )

              except Exception as error:
                  print(
                      "Search failed:",
                      type(error).__name__,
                      str(error),
                  )

          print("\nDiagnostic complete")
          PY
