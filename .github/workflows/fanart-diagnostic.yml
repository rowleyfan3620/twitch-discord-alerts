
name: Diagnose Fan Art Discovery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Diagnose Openverse
        env:
          OPENVERSE_CLIENT_ID: ${{ secrets.OPENVERSE_CLIENT_ID }}
          OPENVERSE_CLIENT_SECRET: ${{ secrets.OPENVERSE_CLIENT_SECRET }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from collections import Counter

          BASE = "https://api.openverse.org/v1"

          def get_json(url, data=None, token=None):
              headers = {
                  "User-Agent": "DidacticJamArtBot/1.0",
                  "Accept": "application/json",
              }

              if data is not None:
                  headers["Content-Type"] = "application/x-www-form-urlencoded"

              if token:
                  headers["Authorization"] = "Bearer " + token

              for attempt in range(1, 4):
                  try:
                      req = urllib.request.Request(
                          url, data=data, headers=headers
                      )
                      with urllib.request.urlopen(
                          req, timeout=20
                      ) as response:
                          return json.load(response)

                  except urllib.error.HTTPError as error:
                      print(
                          f"HTTP {error.code}, attempt {attempt}/3",
                          flush=True
                      )
                      if error.code not in (429, 500, 502, 503, 504):
                          raise

                  except (TimeoutError, urllib.error.URLError) as error:
                      print(
                          f"Connection error, attempt {attempt}/3: {error}",
                          flush=True
                      )

                  if attempt < 3:
                      time.sleep(attempt * 3)

              raise RuntimeError("Openverse unavailable after retries")

          body = urllib.parse.urlencode({
              "client_id": os.environ["OPENVERSE_CLIENT_ID"],
              "client_secret": os.environ["OPENVERSE_CLIENT_SECRET"],
              "grant_type": "client_credentials",
          }).encode()

          try:
              auth = get_json(
                  BASE + "/auth_tokens/token/",
                  data=body,
              )
              token = auth["access_token"]
              print("Authentication: SUCCESS", flush=True)
          except Exception as error:
              print("Authentication failed:", error, flush=True)
              print("Try running this workflow later.")
              raise SystemExit(0)

          searches = [
              "Resident Evil Code Veronica",
              "Code Veronica",
              "Claire Redfield",
              "Resident Evil fanart",
          ]

          for query in searches:
              print("\nSEARCH:", query, flush=True)

              params = urllib.parse.urlencode({
                  "q": query,
                  "page_size": 20,
                  "mature": "false",
              })

              try:
                  data = get_json(
                      BASE + "/images/?" + params,
                      token=token,
                  )
              except Exception as error:
                  print("Search unavailable:", error, flush=True)
                  continue

              results = data.get("results", [])

              print("Total results:", data.get("result_count"))
              print("Returned:", len(results))

              licenses = Counter(
                  str(x.get("license")) for x in results
              )
              print("Licenses:", dict(licenses))

              reasons = Counter()
              survivors = []

              for item in results:
                  if item.get("mature") is not False:
                      reasons["Mature/unknown"] += 1
                  elif item.get("license") not in ("by", "by-sa", "cc0"):
                      reasons["License"] += 1
                  elif not item.get("creator"):
                      reasons["No creator"] += 1
                  elif not item.get("foreign_landing_url"):
                      reasons["No source URL"] += 1
                  elif not item.get("url"):
                      reasons["No image URL"] += 1
                  elif (item.get("width") or 0) < 600:
                      reasons["Width"] += 1
                  elif (item.get("height") or 0) < 300:
                      reasons["Height"] += 1
                  elif (item.get("width") or 0) < (item.get("height") or 0):
                      reasons["Portrait"] += 1
                  else:
                      survivors.append(item)

              print("Rejected:", dict(reasons))
              print("Survivors before game matching:", len(survivors))

              for item in results[:5]:
                  print(
                      "Sample:",
                      str(item.get("title") or "")[:100],
                      "| License:", item.get("license"),
                      "| Creator:", str(item.get("creator"))[:60],
                  )

          print("\nDiagnostic finished", flush=True)
          PY
